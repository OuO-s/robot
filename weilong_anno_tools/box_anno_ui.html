<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>箱内卫龙 · 手动标注</title>
<style>
  :root { --bg:#1b1f24; --pan:#242a31; --line:#333b44; --txt:#dfe6ee; --acc:#4da3ff; --ok:#37c871; --emp:#ff7a7a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font:14px/1.4 "Segoe UI",system-ui,sans-serif; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  header { display:flex; align-items:center; gap:14px; padding:8px 14px; background:var(--pan); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; font-weight:600; }
  #prog { flex:1; min-width:160px; display:flex; align-items:center; gap:10px; font-size:13px; }
  #bar { flex:1; height:8px; background:var(--bg); border-radius:5px; overflow:hidden; }
  #bar i { display:block; height:100%; background:var(--ok); width:0; transition:width .2s; }
  .btn { padding:6px 14px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--txt); cursor:pointer; font-size:13px; }
  .btn:hover { border-color:var(--acc); color:var(--acc); }
  .btn.pri { background:var(--acc); border-color:var(--acc); color:#fff; }
  .btn.emp { background:var(--emp); border-color:var(--emp); color:#fff; }
  .btn.on { background:#3a4652; }
  main { flex:1; display:flex; min-height:0; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; padding:12px; min-width:0; background:#14171b; }
  #wrap { position:relative; }
  canvas { display:block; max-width:100%; max-height:calc(100vh - 160px); cursor:crosshair; box-shadow:0 0 18px #000a; }
  #cur { position:absolute; top:6px; left:8px; font-size:13px; color:#fff; background:#000a; padding:2px 8px; border-radius:4px; }
  aside { width:225px; background:var(--pan); border-left:1px solid var(--line); padding:12px; display:flex; flex-direction:column; gap:7px; overflow-y:auto; }
  aside h3 { font-size:13px; color:#9fb0c3; font-weight:600; margin-top:4px; }
  #info { font-size:13px; line-height:1.6; }
  #info b { color:var(--acc); }
  .kbd { background:#111; border:1px solid var(--line); border-radius:4px; padding:0 5px; font:12px monospace; }
  footer { height:92px; background:var(--pan); border-top:1px solid var(--line); display:flex; overflow-x:auto; padding:8px; gap:6px; }
  .thumb { position:relative; flex:0 0 auto; cursor:pointer; border:3px solid var(--line); border-radius:4px; }
  .thumb img { display:block; height:60px; }
  .thumb.on { border-color:#fff; }
  .thumb.done { border-color:var(--ok); }
  .thumb.emp { border-color:var(--emp); }
  .thumb i { position:absolute; right:2px; bottom:1px; font:10px/1 monospace; color:#fff; background:#000b; padding:1px 3px; border-radius:2px; font-style:normal; }
  footer::-webkit-scrollbar { height:8px; } footer::-webkit-scrollbar-thumb { background:var(--line); border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1>箱内卫龙标注（每袋一框，空箱标空）</h1>
  <div id="prog"><span id="ptxt">0/0</span><div id="bar"><i></i></div></div>
  <button class="btn pri" id="export">完成并提交全部</button>
</header>
<main>
  <div id="stage"><div id="wrap">
    <canvas id="cv"></canvas>
    <div id="cur"></div>
  </div></div>
  <aside>
    <h3>当前图片</h3>
    <div id="info"></div>
    <h3>画框模式</h3>
    <div style="display:flex;gap:6px">
      <button class="btn pri" id="mRect" style="flex:1">矩形拖拽 (R)</button>
      <button class="btn" id="mQuad" style="flex:1">四点 (Q)</button>
    </div>
    <h3>操作</h3>
    <button class="btn" id="bUndo">撤销上一框 (Ctrl+Z)</button>
    <button class="btn" id="bDel">删除选中框 (Del)</button>
    <button class="btn" id="bClear">清空本图全部框</button>
    <button class="btn" id="bCopy">复制上一张的框 (C)</button>
    <button class="btn emp" id="bEmpty">本图无袋 · 标记为空 (X)</button>
    <button class="btn pri" id="bNext">保存并下一张 (Enter/→)</button>
    <button class="btn" id="bPrev">上一张 (←)</button>
    <button class="btn" id="bJump">跳到未标注 (J)</button>
    <h3>说明</h3>
    <div style="font-size:12px;color:#9fb0c3;line-height:1.7">
      矩形模式：按住拖一下就是一个框，一图可拖 30+ 个。<br>
      拖红角点微调；拖框内整体移动。<br>
      后面的图和前面几乎一样，点 <span class="kbd">C</span> 复制上一张再删掉少了的袋更快。<br>
      空图直接 <span class="kbd">X</span>。
    </div>
  </aside>
</main>
<footer id="strip"></footer>
<script>
let IMGS=[], ST={}, cur=0, img=new Image(), W=848, H=480;
let shapes=[], pend=[], sel=-1, drag=null, wasDrag=false, emptyFlag=false, mode='rect', rectDrag=null;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');

function $(id){return document.getElementById(id)}
async function boot(){
  const r=await (await fetch('/api/bootstrap')).json();
  IMGS=r.images; ST=r.state; W=r.w; H=r.h; cv.width=W; cv.height=H;
  show(0); buildStrip();
}
function entry(){ return ST[IMGS[cur].key] }
function isDone(){ const e=entry(); return e&&e.done; }

function show(i){
  cur=i; const v=IMGS[i]; const e=ST[v.key]||{};
  shapes=(e.shapes||[]).map(s=>s.map(p=>[+p[0],+p[1]]));
  emptyFlag=!!e.empty; pend=[]; sel=-1; rectDrag=null;
  img.onload=()=>schedDraw();
  img.src='/img/'+v.file;
  $('info').innerHTML=`文件: <b>${v.file}</b><br>序号: ${i+1} / ${IMGS.length}<br>框数: <b id="nsh">${shapes.length}</b><br>状态: <b id="stt">${stTxt()}</b>`;
  $('cur').textContent=v.file;
  // 预载前后图, 翻页零等待
  [cur+1,cur-1].forEach(j=>{ if(IMGS[j]){const p=new Image(); p.src='/img/'+IMGS[j].file;} });
  refresh();
}
function stTxt(){ if(emptyFlag)return '<span style="color:var(--emp)">空（无袋）</span>'; const e=entry(); if(!e||!e.done)return'未标注'; return'已标注'; }

function draw(){
  ctx.drawImage(img,0,0,W,H);
  for(let k=0;k<shapes.length;k++){
    ctx.strokeStyle = k===sel ? '#fff' : '#37c871';
    ctx.lineWidth = 2.5; ctx.beginPath();
    shapes[k].forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.closePath(); ctx.stroke();
    if(k===sel){ ctx.fillStyle='#f33';
      shapes[k].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],5,0,7);ctx.fill();}); }
    const c=shapes[k].reduce((a,p)=>[a[0]+p[0]/4,a[1]+p[1]/4],[0,0]);
    ctx.fillStyle='#fff'; ctx.font='bold 13px sans-serif'; ctx.fillText(k+1,c[0]-6,c[1]+5);
  }
  if(rectDrag){ ctx.strokeStyle='#ff0'; ctx.lineWidth=2; ctx.setLineDash([6,4]);
    ctx.strokeRect(rectDrag[0],rectDrag[1],rectDrag[2]-rectDrag[0],rectDrag[3]-rectDrag[1]);
    ctx.setLineDash([]); }
  if(pend.length){ ctx.strokeStyle='#ff0'; ctx.lineWidth=2; ctx.setLineDash([6,4]); ctx.beginPath();
    pend.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    if(pend.length>1)ctx.lineTo(mouse[0],mouse[1]);
    ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#ff0'; pend.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],5,0,7);ctx.fill();}); }
}
let mouse=[0,0], rafPend=false;
function schedDraw(){ if(rafPend)return; rafPend=true; requestAnimationFrame(()=>{rafPend=false;draw();}); }
function pos(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];}
function inPoly(p,s){let c=false;for(let i=0,j=s.length-1;i<s.length;j=i++){if(((s[i][1]>p[1])!=(s[j][1]>p[1]))&&(p[0]<(s[j][0]-s[i][0])*(p[1]-s[i][1])/(s[j][1]-s[i][1])+s[i][0]))c=!c;}return c;}
function nearPt(p){for(let k=0;k<shapes.length;k++)for(let j=0;j<shapes[k].length;j++)if(Math.hypot(p[0]-shapes[k][j][0],p[1]-shapes[k][j][1])<8)return [k,j];return null;}

cv.addEventListener('mousemove',e=>{
  mouse=pos(e);
  if(drag){
    const dx=mouse[0]-drag.m[0],dy=mouse[1]-drag.m[1];
    if(drag.pt!==undefined){shapes[drag.sh][drag.pt]=[mouse[0],mouse[1]];}
    else drag.pts.forEach((o,j)=>{shapes[drag.sh][j]=[o[0]+dx,o[1]+dy];});
    schedDraw(); return;
  }
  if(rectDrag){ rectDrag[2]=mouse[0]; rectDrag[3]=mouse[1]; schedDraw(); return; }
  const n=nearPt(mouse), onS=!n&&shapes.some(s=>inPoly(mouse,s));
  cv.style.cursor = n||onS ? 'move' : 'crosshair';
  if(onS){ const k=shapes.findIndex(s=>inPoly(mouse,s)); if(k!==sel){sel=k;schedDraw();} }
});
cv.addEventListener('mousedown',e=>{
  const p=pos(e);
  if(e.button!==0)return;
  const n=nearPt(p);
  if(n){drag={sh:n[0],pt:n[1],m:p};return;}
  for(let k=shapes.length-1;k>=0;k--) if(inPoly(p,shapes[k])){sel=k;drag={sh:k,pts:shapes[k].map(q=>[...q]),m:p};schedDraw();return;}
  sel=-1;
  if(mode==='rect'){ rectDrag=[p[0],p[1],p[0],p[1]]; }
  schedDraw();
});
window.addEventListener('mouseup',e=>{
  if(drag){wasDrag=true;drag=null;return;}
  if(rectDrag){
    const [x1,y1,x2,y2]=rectDrag.map(Math.round);
    rectDrag=null;
    if(Math.abs(x2-x1)>7&&Math.abs(y2-y1)>7){
      const a=[Math.min(x1,x2),Math.min(y1,y2)],b=[Math.max(x1,x2),Math.max(y1,y2)];
      shapes.push([[a[0],a[1]],[b[0],a[1]],[b[0],b[1]],[a[0],b[1]]]);
      sel=shapes.length-1; syncCount();
    }
    schedDraw(); return;
  }
  wasDrag=false;
});
cv.addEventListener('click',e=>{
  if(wasDrag){wasDrag=false;return;}
  if(mode!=='quad')return;
  const p=pos(e);
  if(pend.length>=3 && Math.hypot(p[0]-pend[0][0],p[1]-pend[0][1])<14){closeShape();return;}
  pend.push([Math.round(p[0]),Math.round(p[1])]);
  if(pend.length>=4)closeShape();
  schedDraw();
});
function closeShape(){ if(pend.length>=3){shapes.push(pend);sel=shapes.length-1;} pend=[];schedDraw();syncCount(); }
function syncCount(){ const n=$('nsh'); if(n)n.textContent=shapes.length; }
function setMode(m){ mode=m; pend=[]; rectDrag=null;
  $('mRect').className='btn'+(m==='rect'?' pri':''); $('mRect').style.flex=1;
  $('mQuad').className='btn'+(m==='quad'?' pri':''); $('mQuad').style.flex=1; schedDraw(); }

async function save(advance,asEmpty){
  const v=IMGS[cur];
  emptyFlag=!!asEmpty;
  if(asEmpty)shapes=[];
  ST[v.key]={shapes:shapes.map(s=>s.map(p=>[Math.round(p[0]),Math.round(p[1])])),empty:emptyFlag,done:true};
  try{ await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({key:v.key,shapes:ST[v.key].shapes,empty:emptyFlag,done:true})}); }catch(_){}
  refresh();
  if(advance)next(1);
}
function next(d){
  cur=Math.min(Math.max(cur+d,0),IMGS.length-1);
  show(cur);
}
function jump(){
  for(let i=0;i<IMGS.length;i++){ const j=(cur+1+i)%IMGS.length;
    if(!(ST[IMGS[j].key]&&ST[IMGS[j].key].done)){show(j);return;} }
  alert('全部 50 张都已处理！点右上角「完成并提交全部」');
}
function copyPrev(){
  if(cur===0)return;
  const e=ST[IMGS[cur-1].key];
  if(!e||!e.shapes||!e.shapes.length){alert('上一张还没有框');return;}
  shapes=e.shapes.map(s=>s.map(p=>[...p])); emptyFlag=false; sel=-1;
  schedDraw(); syncCount();
}
function refresh(){
  const total=IMGS.length, done=IMGS.filter(v=>ST[v.key]&&ST[v.key].done).length;
  const emp=IMGS.filter(v=>ST[v.key]&&ST[v.key].empty).length;
  $('ptxt').textContent=`${done}/${total}（空 ${emp}）`;
  $('bar').firstElementChild.style.width=(100*done/total)+'%';
  const stt=$('stt'); if(stt)stt.innerHTML=stTxt();
  updateStrip();
}
let thumbEls={};
function buildStrip(){
  const st=$('strip'); const frag=document.createDocumentFragment();
  IMGS.forEach((v,i)=>{
    const d=document.createElement('div'); d.className='thumb';
    const im=document.createElement('img');
    im.src='/thumb/'+v.file; im.loading='lazy'; im.decoding='async'; im.width=106; im.height=60;
    const lbl=document.createElement('i'); lbl.textContent=v.file.replace('_Color.png','');
    d.append(im,lbl); d.onclick=()=>show(i);
    thumbEls[i]=d; frag.appendChild(d);
  });
  st.appendChild(frag); updateStrip();
}
function updateStrip(){
  for(const i in thumbEls){
    const e=ST[IMGS[i].key];
    thumbEls[i].classList.toggle('on', +i===cur);
    thumbEls[i].classList.toggle('emp', !!(e&&e.empty));
    thumbEls[i].classList.toggle('done', !!(e&&e.done&&!e.empty));
  }
  const el=thumbEls[cur];
  if(el)el.scrollIntoView({inline:'center',block:'nearest'});
}
$('mRect').onclick=()=>setMode('rect');
$('mQuad').onclick=()=>setMode('quad');
$('bNext').onclick=()=>save(true);
$('bPrev').onclick=()=>next(-1);
$('bEmpty').onclick=()=>save(true,true);
$('bUndo').onclick=()=>{shapes.pop();sel=-1;schedDraw();syncCount();};
$('bDel').onclick=()=>{if(sel>=0){shapes.splice(sel,1);sel=-1;schedDraw();syncCount();}};
$('bClear').onclick=()=>{shapes=[];pend=[];sel=-1;schedDraw();syncCount();};
$('bCopy').onclick=copyPrev;
$('bJump').onclick=jump;
$('export').onclick=async()=>{
  const left=IMGS.filter(v=>!(ST[v.key]&&ST[v.key].done)).length;
  if(left && !confirm(`还有 ${left} 张未标注，确定现在提交？未标注的不会生成标注文件。`))return;
  if(!left && !confirm('确定提交全部？将写入 weilongBox-data 并生成可视化。'))return;
  const r=await (await fetch('/api/export',{method:'POST'})).json();
  const s=r.summary;
  alert(`提交完成！\n有框: ${s.annotated} 张\n空: ${s.empty} 张\n未处理: ${s.skipped} 张\n\n标注已写入 dataset_seg/weilongBox-data，\n检查页: dataset_seg_vis/weilongBox/index.html`);
};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();shapes.pop();sel=-1;schedDraw();syncCount();return;}
  if(k==='enter'){e.preventDefault();save(true);}
  else if(k==='arrowright'){next(1)} else if(k==='arrowleft'){next(-1)}
  else if(k==='x'){save(true,true)} else if(k==='j'){jump()}
  else if(k==='c'){copyPrev()}
  else if(k==='r'){setMode('rect')} else if(k==='q'){setMode('quad')}
  else if(k==='delete'||k==='backspace'){if(sel>=0){shapes.splice(sel,1);sel=-1;schedDraw();syncCount();}}
  else if(k==='z'){pend.pop();schedDraw()}
  else if(k==='escape'){pend=[];rectDrag=null;schedDraw()}
});
setMode('rect');
boot();
</script>
</body>
</html>
